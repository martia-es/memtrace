server {
    listen 8080;
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    # the library pages used to live at the site root; keep old links working
    location ~ ^/(authentication|configuration|conversations|installation|integrations|quickstart|tracing)/?$ {
        return 301 /library/$1;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # hashed build assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
