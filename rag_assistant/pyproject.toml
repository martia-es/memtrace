[project]
name = "rag-assistant"
version = "0.1.0"
description = "Asistente RAG de preguntas frecuentes (FAQs) con Pydantic AI, expuesto por API + UI"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai-slim[google]>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "numpy>=1.26",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "memtrace-ai",
]

[tool.uv.sources]
memtrace-ai = { path = "../sdk/python", editable = true }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
