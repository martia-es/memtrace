apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: memtrace
resources:
  - k8s/00-namespace.yaml
  - k8s/10-clickhouse-secret.yaml
  - k8s/15-postgres-secret.yaml
  - k8s/20-clickhouse.yaml
  - k8s/25-postgres.yaml
  - k8s/30-clickhouse-migrations.yaml
  - k8s/35-postgres-migrations.yaml
  - k8s/40-otel-collector.yaml
  - k8s/50-api.yaml
  - k8s/60-dashboard.yaml
  - k8s/70-docs.yaml
  - k8s/80-topic-extraction.yaml
  - k8s/81-model-pricing-sync.yaml
configMapGenerator:
  - name: clickhouse-migrations
    files:
      - migrations/clickhouse/001_init_traces.sql
      - migrations/clickhouse/002_conversation_id.sql
      - migrations/clickhouse/003_span_topics.sql
      - migrations/clickhouse/004_model_pricing.sql
      - migrations/clickhouse/005_scores.sql
      - migrations/clickhouse/006_score_judge_identity.sql
      - migrations/clickhouse/007_annotations.sql
      - migrations/clickhouse/008_eval_items_and_scores.sql
      - migrations/clickhouse/009_eval_partitions_ttl_and_run_summaries.sql
    options:
      disableNameSuffixHash: true   # el Job referencia el nombre fijo del ConfigMap
  - name: postgres-migrations
    files:
      - migrations/postgres/001_init_identity.sql
      - migrations/postgres/002_api_keys.sql
      - migrations/postgres/003_pending_invitations.sql
      - migrations/postgres/004_organization_theme.sql
      - migrations/postgres/005_custom_metrics.sql
      - migrations/postgres/006_evaluation.sql
      - migrations/postgres/007_dataset_versioning.sql
      - migrations/postgres/008_dataset_item_audit_and_semver.sql
      - migrations/postgres/009_metric_reports.sql
      - migrations/postgres/010_dataset_item_deletion_audit.sql
      - migrations/postgres/011_dataset_item_origin.sql
      - migrations/postgres/012_dataset_run_status.sql
      - migrations/postgres/013_score_configs.sql
      - migrations/postgres/014_annotation_queues.sql
      - migrations/postgres/015_queue_item_population.sql
      - migrations/postgres/016_reset_dataset_runs.sql
    options:
      disableNameSuffixHash: true   # el Job referencia el nombre fijo del ConfigMap
  - name: clickhouse-config
    files:
      - k8s/config/clickhouse-low-footprint.xml
    # con hash en el nombre: cambiar la config cambia la plantilla y reinicia el StatefulSet
secretGenerator:
  - name: identity-oauth-credentials
    envs:
      - k8s/secrets/identity-oauth.env   # NO commiteado (ver k8s/secrets/README.md); ADR-013
    # con hash en el nombre: si cambian los secretos, el Deployment de la API se reinicia solo
  - name: resend-credentials
    envs:
      - k8s/secrets/resend.env   # NO commiteado (ver k8s/secrets/README.md)
    # con hash en el nombre: si cambia la API key, el Deployment de la API se reinicia solo
