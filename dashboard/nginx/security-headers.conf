# Cabeceras de seguridad (ADR-081). `add_header` de un bloque location sustituye a las del nivel superior, así que este
# fichero se incluye en CADA location. HSTS no va aquí: lo pone quien termina TLS (el ingress), porque sobre HTTP plano
# el navegador lo ignora.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
