[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memtrace-topic-extraction"
version = "0.1.0"
description = "Async enrichment worker: extracts response topics from ClickHouse traces with BERTopic (ADR-022)"
readme = "README.md"
requires-python = ">=3.10.18"
dependencies = [
    "bertopic>=0.16",
    "sentence-transformers>=3.0",
    "clickhouse-connect>=0.7",
]

[tool.setuptools.packages.find]
include = ["topic_extraction*"]
