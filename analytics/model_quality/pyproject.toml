[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memtrace-model-quality"
version = "0.1.0"
description = "Sync worker: downloads the Arena leaderboard (quality score per model) into ClickHouse (ADR-025)"
readme = "README.md"
requires-python = ">=3.10.18"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=15",
    "clickhouse-connect>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["model_quality*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
