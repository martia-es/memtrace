# El ConfigMap `clickhouse-migrations` lo genera kustomize (ver kustomization.yaml).
# Los Jobs son inmutables: para relanzar, borrar antes el Job (ver docs/phase_1_design.md §0.3).
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-migrate
  namespace: memtrace
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: clickhouse-migrate
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: clickhouse/clickhouse-server:24.3-alpine
        env:
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: password
        - name: CLICKHOUSE_WRITER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: writer-password
        - name: CLICKHOUSE_RETENTION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: retention-password
        - name: CLICKHOUSE_READER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: reader-password
        - name: CLICKHOUSE_COLLECTOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: collector-password
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          CH="clickhouse-client --host clickhouse --user default --password $CLICKHOUSE_PASSWORD"
          until $CH --query "SELECT 1" >/dev/null 2>&1; do echo "waiting for clickhouse"; sleep 2; done
          $CH --query "CREATE DATABASE IF NOT EXISTS memtrace"
          $CH --query "CREATE TABLE IF NOT EXISTS memtrace.schema_migrations (version String, applied_at DateTime DEFAULT now()) ENGINE = MergeTree ORDER BY version"
          for f in $(ls /migrations/*.sql | sort); do
            v=$(basename "$f")
            done_count=$($CH --query "SELECT count() FROM memtrace.schema_migrations WHERE version = '$v'")
            if [ "$done_count" = "0" ]; then
              echo "applying $v"
              $CH --multiquery < "$f"
              $CH --query "INSERT INTO memtrace.schema_migrations (version) VALUES ('$v')"
            else
              echo "skipping $v (already applied)"
            fi
          done
          # Usuario de escritura de la API (ADR-045): INSERT solo en las tablas de evaluación, sin SELECT ni acceso a otel_*.
          # Idempotente: CREATE + ALTER dejan la contraseña del secreto aunque el usuario ya existiera.
          $CH --query "CREATE USER IF NOT EXISTS api_writer IDENTIFIED WITH sha256_password BY '$CLICKHOUSE_WRITER_PASSWORD'"
          $CH --query "ALTER USER api_writer IDENTIFIED WITH sha256_password BY '$CLICKHOUSE_WRITER_PASSWORD'"
          for t in eval_items eval_scores eval_run_summaries annotations user_feedback; do
            $CH --query "GRANT INSERT ON memtrace.$t TO api_writer"
          done
          # Usuario del CronJob de retención (ADR-084): lee y borra solo en las tablas de trazas. No inserta, no borra en
          # ninguna otra tabla y no puede alterar el esquema.
          $CH --query "CREATE USER IF NOT EXISTS retention_worker IDENTIFIED WITH sha256_password BY '$CLICKHOUSE_RETENTION_PASSWORD'"
          $CH --query "ALTER USER retention_worker IDENTIFIED WITH sha256_password BY '$CLICKHOUSE_RETENTION_PASSWORD'"
          for t in otel_traces span_topics; do
            $CH --query "GRANT SELECT, ALTER DELETE ON memtrace.$t TO retention_worker"
          done
          # Usuario de lectura de la API (ADR-090): solo SELECT, y no puede cambiar `readonly` (=2 permite fijar max_threads por consulta)
          $CH --query "CREATE USER IF NOT EXISTS api_reader IDENTIFIED WITH sha256_password BY '$CLICKHOUSE_READER_PASSWORD' SETTINGS readonly = 2"
          $CH --query "ALTER USER api_reader IDENTIFIED WITH sha256_password BY '$CLICKHOUSE_READER_PASSWORD'"
          $CH --query "GRANT SELECT ON memtrace.* TO api_reader"
          # Usuario del Collector (ADR-090): INSERT en las trazas. El exporter 0.96 ejecuta CREATE ... IF NOT EXISTS al arrancar
          # (base, tablas de trazas y su vista) y la vista materializada lee Timestamp y TraceId del bloque insertado; no puede
          # leer el contenido de los spans, ni borrar o alterar nada.
          $CH --query "CREATE USER IF NOT EXISTS collector IDENTIFIED WITH sha256_password BY '$CLICKHOUSE_COLLECTOR_PASSWORD'"
          $CH --query "ALTER USER collector IDENTIFIED WITH sha256_password BY '$CLICKHOUSE_COLLECTOR_PASSWORD'"
          $CH --query "GRANT CREATE DATABASE ON memtrace.* TO collector"
          $CH --query "GRANT INSERT, CREATE TABLE ON memtrace.otel_traces TO collector"
          $CH --query "GRANT SELECT(Timestamp, TraceId) ON memtrace.otel_traces TO collector"
          $CH --query "GRANT SELECT, INSERT, CREATE TABLE ON memtrace.otel_traces_trace_id_ts TO collector"
          $CH --query "GRANT CREATE VIEW ON memtrace.otel_traces_trace_id_ts_mv TO collector"
        volumeMounts:
        - name: migrations
          mountPath: /migrations
      volumes:
      - name: migrations
        configMap:
          name: clickhouse-migrations
