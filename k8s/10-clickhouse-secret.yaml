# Credencial de desarrollo local. NO reutilizar en entornos compartidos.
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: memtrace
type: Opaque
stringData:
  password: "memtrace-dev-only"
  # Usuario `api_writer` (ADR-045): solo INSERT en eval_items, eval_scores, eval_run_summaries, annotations y user_feedback
  writer-password: "memtrace-writer-dev-only"
  # Usuario `api_reader` (ADR-079): solo SELECT sobre `memtrace`; es el que usa la API para leer
  reader-password: "memtrace-reader-dev-only"
  # Usuario `collector` (ADR-079): solo INSERT en las tablas de trazas; es el que usa el OpenTelemetry Collector
  collector-password: "memtrace-collector-dev-only"
