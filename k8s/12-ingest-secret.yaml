# Token que la pasarela de ingesta de la API presenta al Collector (ADR-079). Credencial de desarrollo local: en un
# entorno compartido sustitúyela por un secreto real (p. ej. `openssl rand -hex 32`) y rota la de ClickHouse a la vez.
apiVersion: v1
kind: Secret
metadata:
  name: ingest-internal
  namespace: memtrace
type: Opaque
stringData:
  token: "memtrace-ingest-dev-only"
