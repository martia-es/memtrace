# API de consulta (pieza 4): único componente con acceso a ClickHouse (ADR-009).
# La imagen `memtrace/api:dev` se construye y carga en el clúster con `make images`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: memtrace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: memtrace/api:dev
        imagePullPolicy: IfNotPresent   # imagen local cargada en kind: no hay registro
        env:
        - name: CLICKHOUSE_URL
          value: http://clickhouse:8123
        - name: CLICKHOUSE_USER
          value: default
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: password
        - name: CLICKHOUSE_DATABASE
          value: memtrace
        ports:
        - containerPort: 3001
          name: http
        readinessProbe:
          httpGet:
            path: /api/v1/health/ready   # comprueba también que ClickHouse responde
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/health         # solo el proceso: una caída de ClickHouse no debe reiniciar la API
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: memtrace
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    name: http
  selector:
    app: api
