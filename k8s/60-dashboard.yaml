# Dashboard (pieza 5): nginx sirve la SPA y reenvía /api a la API (mismo origen, sin CORS).
# La imagen `memtrace/dashboard:dev` se construye y carga en el clúster con `make images`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: memtrace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard
        image: memtrace/dashboard:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: API_UPSTREAM
          value: http://api:3001
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: memtrace
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: dashboard
