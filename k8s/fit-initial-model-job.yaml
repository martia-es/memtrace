# Job puntual para el fit inicial del modelo de temáticas (ADR-022, ver analytics/README.md).
# No forma parte de kustomization.yaml: se aplica a mano una vez y se borra tras usarlo.
apiVersion: batch/v1
kind: Job
metadata:
  name: topic-extraction-fit-initial
  namespace: memtrace
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: topic-extraction-fit-initial
    spec:
      restartPolicy: Never
      containers:
        - name: fit-initial
          image: localhost/memtrace/topic-extraction:dev
          imagePullPolicy: Never
          command: ["python", "-m", "topic_extraction.fit_initial_model", "--days", "365", "--sample-size", "5000", "--model-path", "/model/bertopic"]
          env:
            - name: CLICKHOUSE_HOST
              value: clickhouse
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
            - name: CLICKHOUSE_DATABASE
              value: memtrace
            # numba (usado por UMAP/BERTopic) necesita un directorio de caché JIT escribible por el usuario 1000
            - name: NUMBA_CACHE_DIR
              value: /tmp/numba-cache
            # sentence-transformers descarga el modelo de embeddings a $HF_HOME; sin HOME escribible (usuario 1000) falla
            - name: HF_HOME
              value: /tmp/hf-cache
          volumeMounts:
            - name: topic-model
              mountPath: /model
      volumes:
        - name: topic-model
          persistentVolumeClaim:
            claimName: topic-model
