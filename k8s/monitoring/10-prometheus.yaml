# Prometheus (ADR-098): lee las métricas del pipeline de ingesta, evalúa las reglas de alerta (config/alerts.yaml) y guarda
# 15 días. Es opcional: `make monitoring` lo despliega junto a Grafana. Sin descubrimiento por la API de Kubernetes (ver
# config/prometheus.yml): no lleva ServiceAccount con permisos ni salida hacia el servidor de la API.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: memtrace
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v2.53.2
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=15d
        - --storage.tsdb.retention.size=4GB   # por debajo del disco (5Gi): si se llena, Prometheus se para
        - --web.listen-address=:9090
        ports:
        - containerPort: 9090
          name: http
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: rules
          mountPath: /etc/prometheus-rules
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: rules
        configMap:
          name: prometheus-rules
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: memtrace
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    name: http
  selector:
    app: prometheus
---
# Services sin IP propia: el DNS devuelve la IP de cada pod, de modo que Prometheus mide cada réplica y no una al azar
# detrás de un Service normal (con varias réplicas, las series se mezclarían y rate() daría valores sin sentido).
apiVersion: v1
kind: Service
metadata:
  name: ingest-metrics
  namespace: memtrace
spec:
  clusterIP: None
  ports:
  - port: 3002
    targetPort: 3002
    name: metrics
  selector:
    app: ingest
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-metrics
  namespace: memtrace
spec:
  clusterIP: None
  ports:
  - port: 8888
    targetPort: 8888
    name: metrics
  selector:
    app: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-metrics
  namespace: memtrace
spec:
  clusterIP: None
  ports:
  - port: 9363
    targetPort: 9363
    name: metrics
  selector:
    app: clickhouse
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-writer-metrics
  namespace: memtrace
spec:
  clusterIP: None
  ports:
  - port: 8888
    targetPort: 8888
    name: metrics
  selector:
    app: otel-collector-writer
---
# Exportador de métricas de Kafka (Apache 2.0): el lag de cada grupo de consumidores, los mensajes publicados por tópico y
# cuántos nodos responden. Solo lee de Kafka; no escribe nada. El espacio en disco del broker no lo da: lo acota la retención
# del tópico (48 h y 512 MiB por partición).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: memtrace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: kafka-exporter
        image: danielqsj/kafka-exporter:v1.8.0
        args:
        - --kafka.server=kafka:9092
        - --web.listen-address=:9308
        ports:
        - containerPort: 9308
          name: metrics
        readinessProbe:
          httpGet:
            path: /health
            port: metrics
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter-metrics
  namespace: memtrace
spec:
  clusterIP: None
  ports:
  - port: 9308
    targetPort: 9308
    name: metrics
  selector:
    app: kafka-exporter
