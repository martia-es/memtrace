name: Python SDK CI

on:
  pull_request:
    paths:
      - "sdk/python/**"
      - ".github/workflows/sdk-python-ci.yml"
  push:
    branches: [main]
    paths:
      - "sdk/python/**"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: sdk/python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,http]"

      - name: Lint
        run: ruff check memtrace tests

      - name: Type check
        if: matrix.python-version == '3.13'
        run: mypy memtrace

      - name: Test
        run: pytest -q

  pii:
    name: PII extra (Presidio)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,http,pii]"
          python -m spacy download en_core_web_sm
          python -m spacy download es_core_news_md
      - name: Test
        run: pytest -q tests/test_pii.py
