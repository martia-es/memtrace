name: Docs links

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-md-links.py"
      - ".github/workflows/docs-links.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  links:
    name: Relative Markdown links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-md-links.py
