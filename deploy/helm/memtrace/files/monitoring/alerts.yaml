# Reglas de alerta del pipeline de ingesta (ADR-098). Prometheus las evalúa y las muestra en su pestaña Alerts y en Grafana.
# No se envían a ningún sitio: el encaminamiento (Alertmanager, correo, Slack) lo pone quien opera la instalación.
# El espacio en disco de Kafka no se mide aquí: lo acotan la retención por tiempo y por tamaño del tópico.
groups:
  - name: memtrace-pipeline
    rules:
      - alert: TargetDown
        expr: up{job=~"ingest|otel-collector|otel-collector-writer|kafka-exporter|clickhouse"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} no responde a Prometheus ({{ $labels.instance }})"
          description: "Prometheus no puede leer las métricas de {{ $labels.job }} desde hace 2 minutos: el pod está caído o no es alcanzable."

      - alert: IngestNoInstances
        expr: absent(up{job="ingest"} == 1)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Ninguna réplica de ingest está viva"
          description: "Los agentes no pueden enviar trazas: el SDK reintenta y, tras 2.048 spans pendientes, descarta."

      - alert: IngestHighErrorRate
        expr: |
          sum(rate(memtrace_ingest_requests_total{code=~"5.."}[5m]))
            / sum(rate(memtrace_ingest_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Más del 5 % de las peticiones de ingesta fallan con 5xx"
          description: "Mira memtrace_ingest_rejections_total{reason=\"identity_unavailable\"} (Postgres) y memtrace_ingest_forward_total{outcome!=\"ok\"} (Collector)."

      - alert: IngestIdentityStoreDown
        expr: min(memtrace_ingest_identity_store_up) == 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "ingest no puede validar API keys contra Postgres"
          description: "Mientras dure, solo se aceptan las keys validadas en los últimos 10 minutos. El valor se actualiza cuando llega tráfico."

      - alert: IngestServingStaleKeys
        expr: sum(rate(memtrace_ingest_key_cache_total{result="stale"}[5m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "ingest acepta keys de su memoria porque Postgres no responde"
          description: "Una key revocada en este tiempo puede seguir funcionando hasta que vuelva Postgres."

      - alert: IngestCollectorFailing
        expr: sum(rate(memtrace_ingest_forward_total{outcome!="ok"}[5m])) > 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "ingest no consigue entregar al Collector"
          description: "outcome=collector_unreachable: el Collector no contesta; collector_status: contesta con un error (memoria, ClickHouse)."

      - alert: CollectorExportFailing
        expr: sum(rate(otelcol_exporter_send_failed_spans[5m])) > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Un Collector no puede entregar spans (a Kafka o a ClickHouse)"
          description: "El Collector de escritura reintenta cada lote hasta 24 h mientras el resto espera en Kafka; pasado ese tiempo lo abandona. El de entrada falla si no puede publicar en Kafka."

      - alert: CollectorRefusingData
        expr: sum(rate(otelcol_receiver_refused_spans[5m])) > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "El Collector rechaza spans (memoria)"
          description: "El limitador de memoria está activo: ingest recibe errores y el SDK reintenta."

      - alert: KafkaNoWriters
        expr: absent(kafka_consumergroup_members{consumergroup="clickhouse-writers"} > 0)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Ningún Collector de escritura está leyendo de Kafka"
          description: "Las trazas se acumulan en el broker (se conservan 48 h o 512 MiB por partición) y no llegan a ClickHouse."

      - alert: KafkaConsumerLagHigh
        expr: sum(kafka_consumergroup_lag{consumergroup="clickhouse-writers", topic="otel-traces"}) > 1000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "El escritor de ClickHouse va con retraso (más de 1.000 mensajes sin escribir)"
          description: "Cada mensaje es un lote de ~512 spans. ClickHouse escribe más despacio de lo que llegan los datos, está caído, o faltan Collectors de escritura. Si sigue creciendo, el broker acabará descartando lo más antiguo."

      - alert: KafkaConsumerLagCritical
        expr: sum(kafka_consumergroup_lag{consumergroup="clickhouse-writers", topic="otel-traces"}) > 20000
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "El retraso de escritura supera los 20.000 mensajes"
          description: "Riesgo real de perder datos: la retención del broker (48 h o 512 MiB por partición) puede alcanzarse antes de que se escriban."

      - alert: KafkaBrokerDown
        expr: kafka_brokers < 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "El exportador no ve ningún nodo de Kafka"
          description: "ingest devuelve 503 y el SDK reintenta; pasados 2.048 spans pendientes descarta."

      - alert: CollectorMemoryHigh
        expr: max by (job) (otelcol_process_memory_rss) > 0.85 * 1024 * 1024 * 1024
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "El Collector usa más del 85 % de su límite de memoria (1 GiB)"
          description: "Cerca de este punto el limitador de memoria empieza a rechazar datos."

      - alert: ClickHouseDiskLow
        expr: min(ClickHouseAsyncMetrics_DiskAvailable_default / ClickHouseAsyncMetrics_DiskTotal_default) < 0.2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "A ClickHouse le queda menos del 20 % de disco"
          description: "Revisa la retención de las trazas (ADR-084) o amplía el volumen."
