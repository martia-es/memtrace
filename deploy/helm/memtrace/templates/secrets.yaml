{{- if .Values.secrets.create }}
{{- $ctx := . }}
{{- $s := .Values.secrets }}
# Credenciales. Los nombres y claves son los que esperan los manifiestos (ver k8s/*-secret.yaml en Kustomize).
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  password: {{ include "memtrace.secretValue" (dict "ctx" $ctx "secret" "clickhouse-credentials" "key" "password" "given" $s.clickhouse.password) | quote }}
  writer-password: {{ include "memtrace.secretValue" (dict "ctx" $ctx "secret" "clickhouse-credentials" "key" "writer-password" "given" $s.clickhouse.writerPassword) | quote }}
  retention-password: {{ include "memtrace.secretValue" (dict "ctx" $ctx "secret" "clickhouse-credentials" "key" "retention-password" "given" $s.clickhouse.retentionPassword) | quote }}
  reader-password: {{ include "memtrace.secretValue" (dict "ctx" $ctx "secret" "clickhouse-credentials" "key" "reader-password" "given" $s.clickhouse.readerPassword) | quote }}
  collector-password: {{ include "memtrace.secretValue" (dict "ctx" $ctx "secret" "clickhouse-credentials" "key" "collector-password" "given" $s.clickhouse.collectorPassword) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  password: {{ include "memtrace.secretValue" (dict "ctx" $ctx "secret" "postgres-credentials" "key" "password" "given" $s.postgres.password) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ingest-internal
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  token: {{ include "memtrace.secretValue" (dict "ctx" $ctx "secret" "ingest-internal" "key" "token" "given" $s.ingestToken) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: identity-oauth-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  AUTH_SECRET: {{ include "memtrace.secretValue" (dict "ctx" $ctx "secret" "identity-oauth-credentials" "key" "AUTH_SECRET" "given" $s.oauth.authSecret) | quote }}
  GOOGLE_CLIENT_ID: {{ $s.oauth.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ $s.oauth.googleClientSecret | quote }}
  MICROSOFT_APPLICATION_ID: {{ $s.oauth.microsoftApplicationId | quote }}
  MICROSOFT_TENANT_ID: {{ $s.oauth.microsoftTenantId | quote }}
  MICROSOFT_CLIENT_SECRET: {{ $s.oauth.microsoftClientSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: resend-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  RESEND_API_KEY: {{ $s.resend.apiKey | quote }}
  EMAIL_FROM: {{ $s.resend.emailFrom | quote }}
{{- if $s.githubApp.appId }}
---
apiVersion: v1
kind: Secret
metadata:
  name: github-app-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  GITHUB_APP_ID: {{ $s.githubApp.appId | quote }}
  GITHUB_APP_PRIVATE_KEY: {{ $s.githubApp.privateKey | quote }}
  GITHUB_WEBHOOK_SECRET: {{ $s.githubApp.webhookSecret | quote }}
{{- end }}
{{- if .Values.backup.s3.bucket }}
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  bucket: {{ .Values.backup.s3.bucket | quote }}
  prefix: {{ .Values.backup.s3.prefix | quote }}
  region: {{ .Values.backup.s3.region | quote }}
  endpoint: {{ .Values.backup.s3.endpoint | quote }}
  access-key-id: {{ .Values.backup.s3.accessKeyId | quote }}
  secret-access-key: {{ .Values.backup.s3.secretAccessKey | quote }}
{{- end }}
{{- end }}
