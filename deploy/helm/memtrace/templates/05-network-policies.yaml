{{- if .Values.networkPolicy.enabled }}
# Segmentación de red del namespace `memtrace` (ADR-090): todo cerrado salvo los flujos de la arquitectura.
#
#   dashboard ──► api ──► postgres
#       │          └──────► clickhouse (lectura y escritura de evaluación)
#       └─────► ingest ──► postgres (validar API keys)
#                  └─────► otel-collector ──► kafka ◄── otel-collector-writer ──► clickhouse
#                          (`ingest` es el ÚNICO cliente del Collector de entrada, ADR-098; solo el de escritura llega a ClickHouse)
#   jobs (migraciones, backfill, topic-extraction, model-pricing, model-quality, health-probe, retention-purge, alerts-evaluate) ──► postgres / clickhouse
#
# IMPORTANTE: una NetworkPolicy solo vale si el CNI del clúster la aplica. El `kindnet` por defecto de kind puede no
# hacerlo: `make netpol-check` lo comprueba. Aunque no se aplicara, el Collector rechaza lo que no lleve el token de la
# pasarela (k8s/40-otel-collector.yaml), así que esta capa es defensa en profundidad y no la única.
#
# `kubectl port-forward` no pasa por estas políticas (lo usa `make up` para el acceso local desde tu máquina).
---
# 1) Todo denegado, de entrada y de salida
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2) DNS para todos los pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 3) Collector de entrada: solo `ingest` le habla (4318) y él solo habla con Kafka (9092); no llega a ClickHouse (ADR-098)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: otel-collector }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: ingest }
      ports:
        - { protocol: TCP, port: 4318 }
  egress:
    - to:
        - podSelector:
            matchLabels: { app: kafka }
      ports:
        - { protocol: TCP, port: 9092 }
---
# 3b) Collector de escritura: lee de Kafka y escribe en ClickHouse; nadie le habla (sus métricas las lee Prometheus, ver monitoring)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-writer
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: otel-collector-writer }
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: kafka }
      ports:
        - { protocol: TCP, port: 9092 }
    - to:
        - podSelector:
            matchLabels: { app: clickhouse }
      ports:
        - { protocol: TCP, port: 9000 }
---
# 3c) Kafka: lo alcanzan los dos Collectors y el Job que crea el tópico (9092), y los nodos entre sí (9092 y 9093 del quórum)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: kafka }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [otel-collector, otel-collector-writer, kafka-topics]
      ports:
        - { protocol: TCP, port: 9092 }
    - from:
        - podSelector:
            matchLabels: { app: kafka }
      ports:
        - { protocol: TCP, port: 9092 }
        - { protocol: TCP, port: 9093 }
  egress:
    - to:
        - podSelector:
            matchLabels: { app: kafka }
      ports:
        - { protocol: TCP, port: 9092 }
        - { protocol: TCP, port: 9093 }
---
# 3d) Job que crea el tópico: solo habla con Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-topics
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: kafka-topics }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: kafka }
      ports:
        - { protocol: TCP, port: 9092 }
---
# 4) ClickHouse: el Collector de escritura (nativo 9000) y quienes consultan o migran (HTTP 8123 / nativo 9000 el Job de migración)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: clickhouse }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: otel-collector-writer }
      ports:
        - { protocol: TCP, port: 9000 }
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [api, health-probe, topic-extraction, topic-extraction-fit-initial, model-pricing-sync, model-quality-sync, backfill-experiment-id, clickhouse-migrate, retention-purge, alerts-evaluate]
      ports:
        - { protocol: TCP, port: 8123 }
        - { protocol: TCP, port: 9000 }
    # API del sidecar de copias de seguridad (ADR-096) y, para comprobar la restauración, HTTP
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [clickhouse-backup, clickhouse-restore-check]
      ports:
        - { protocol: TCP, port: 7171 }
        - { protocol: TCP, port: 8123 }
---
# 5) PostgreSQL: la API, `ingest` (valida las API keys) y los jobs que leen el almacén de identidad
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [api, ingest, health-probe, backfill-experiment-id, postgres-migrate, retention-purge, alerts-evaluate, postgres-backup, postgres-restore-check]
      ports:
        - { protocol: TCP, port: 5432 }
---
# 6) API: la alcanza el dashboard (que hace de proxy de /api) y, si lo hay, el controlador de ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: api }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: dashboard }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }} }
      ports:
        - { protocol: TCP, port: 3001 }
  egress:
    # lo propio de la arquitectura: identidad y almacén analítico. Ya no el Collector: la ingesta es de `ingest` (ADR-098)
    - to:
        - podSelector:
            matchLabels: { app: postgres }
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels: { app: clickhouse }
      ports:
        - { protocol: TCP, port: 8123 }
    # el resto es Internet: proveedor de identidad, Resend, GitHub, jueces LLM y el chat de los agentes (ADR-055, con su
    # propia protección SSRF). Nunca las redes del clúster, para que un fallo de la API no sea un salto lateral.
    # Ajusta `except` a los CIDR de pods y servicios de tu clúster (aquí, los de kind).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{ toJson .Values.networkPolicy.internalCidrs }}
---
# 6b) Ingest (ADR-098): lo alcanza el dashboard (que hace de proxy de /api/v1/ingest) y, si lo hay, el controlador de ingress.
# Solo habla con Postgres (validar keys) y con el Collector; nunca con ClickHouse ni con Internet
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingest
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: ingest }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: dashboard }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }} }
      ports:
        - { protocol: TCP, port: 3002 }
  egress:
    - to:
        - podSelector:
            matchLabels: { app: postgres }
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels: { app: otel-collector }
      ports:
        - { protocol: TCP, port: 4318 }
---
# 7) Dashboard (nginx): solo habla con la API y con `ingest`; lo alcanza el controlador de ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: dashboard }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }} }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector:
            matchLabels: { app: api }
      ports:
        - { protocol: TCP, port: 3001 }
    - to:
        - podSelector:
            matchLabels: { app: ingest }
      ports:
        - { protocol: TCP, port: 3002 }
---
# 8) Documentación: solo estáticos, sin salida
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docs
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: docs }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }} }
      ports:
        - { protocol: TCP, port: 8080 }
---
# 9) Jobs que leen o migran los almacenes: salen solo hacia ellos
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobs-to-stores
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [clickhouse-migrate, postgres-migrate, backfill-experiment-id, topic-extraction, topic-extraction-fit-initial, model-pricing-sync, model-quality-sync, health-probe, retention-purge, alerts-evaluate]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: clickhouse }
      ports:
        - { protocol: TCP, port: 8123 }
        - { protocol: TCP, port: 9000 }
    - to:
        - podSelector:
            matchLabels: { app: postgres }
      ports:
        - { protocol: TCP, port: 5432 }
---
# 10) Salida a Internet de los jobs que la necesitan: descarga de modelos, precios y puntuaciones (topic-extraction, model-pricing-sync, model-quality-sync)
#     sondeo de /health de los agentes (health-probe, con su protección SSRF) y envío de avisos por email (alerts-evaluate → Resend)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobs-internet
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [topic-extraction, topic-extraction-fit-initial, model-pricing-sync, model-quality-sync, health-probe, alerts-evaluate]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{ toJson .Values.networkPolicy.internalCidrs }}
---
# 11) Copias de seguridad de Postgres (ADR-096): solo hablan con Postgres; el de copia sale además a Internet para subir al bucket S3
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-backup
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [postgres-backup, postgres-restore-check]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: postgres }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-backup
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [clickhouse-backup, clickhouse-restore-check]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: clickhouse }
      ports:
        - { protocol: TCP, port: 7171 }
        - { protocol: TCP, port: 8123 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-backup-internet
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: postgres-backup }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{ toJson .Values.networkPolicy.internalCidrs }}
{{- end }}
