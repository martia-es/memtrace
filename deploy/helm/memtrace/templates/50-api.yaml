# API de consulta (pieza 4): único componente con acceso a ClickHouse (ADR-009).
# La imagen `memtrace/api:dev` se construye y carga en el clúster con `make images`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: {{ include "memtrace.image" .Values.images.api }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        env:
        - name: CLICKHOUSE_URL
          value: http://clickhouse:8123
        # Lectura con un usuario que solo puede SELECT sobre `memtrace` (ADR-090)
        - name: CLICKHOUSE_USER
          value: api_reader
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: reader-password
        - name: CLICKHOUSE_DATABASE
          value: memtrace
        # Escrituras de evaluación con un usuario que solo puede INSERT en esas tablas (ADR-045)
        - name: CLICKHOUSE_WRITE_USER
          value: api_writer
        - name: CLICKHOUSE_WRITE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: writer-password
        # Almacén de identidad + login federado (ADR-013)
        - name: POSTGRES_HOST
          value: postgres
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: memtrace
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: POSTGRES_DATABASE
          value: memtrace_identity
        # «Comprobar ahora» del catálogo de asistentes usa las mismas reglas SSRF que el worker (ADR-053); ver k8s/82-health-probe.yaml
        - name: HEALTH_PROBE_ALLOW_PRIVATE_NETWORKS
          value: "true"
        - name: AUTH_URL
          value: {{ .Values.publicUrl | quote }}
        - name: AUTH_SECRET
          valueFrom: { secretKeyRef: { name: identity-oauth-credentials, key: AUTH_SECRET } }
        - name: GOOGLE_CLIENT_ID
          valueFrom: { secretKeyRef: { name: identity-oauth-credentials, key: GOOGLE_CLIENT_ID } }
        - name: GOOGLE_CLIENT_SECRET
          valueFrom: { secretKeyRef: { name: identity-oauth-credentials, key: GOOGLE_CLIENT_SECRET } }
        - name: MICROSOFT_APPLICATION_ID
          valueFrom: { secretKeyRef: { name: identity-oauth-credentials, key: MICROSOFT_APPLICATION_ID } }
        - name: MICROSOFT_TENANT_ID
          valueFrom: { secretKeyRef: { name: identity-oauth-credentials, key: MICROSOFT_TENANT_ID } }
        - name: MICROSOFT_CLIENT_SECRET
          valueFrom: { secretKeyRef: { name: identity-oauth-credentials, key: MICROSOFT_CLIENT_SECRET } }
        # Envío de emails de invitación (ADR-014)
        - name: RESEND_API_KEY
          valueFrom: { secretKeyRef: { name: resend-credentials, key: RESEND_API_KEY } }
        - name: EMAIL_FROM
          valueFrom: { secretKeyRef: { name: resend-credentials, key: EMAIL_FROM } }
        # Despliegue desde MemTrace con una GitHub App (ADR-064). Opcional: sin este Secret la API arranca igual y el botón
        # Deploy responde que no está configurado.
        - name: GITHUB_APP_ID
          valueFrom: { secretKeyRef: { name: github-app-credentials, key: GITHUB_APP_ID, optional: true } }
        - name: GITHUB_APP_PRIVATE_KEY
          valueFrom: { secretKeyRef: { name: github-app-credentials, key: GITHUB_APP_PRIVATE_KEY, optional: true } }
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom: { secretKeyRef: { name: github-app-credentials, key: GITHUB_WEBHOOK_SECRET, optional: true } }
        ports:
        - containerPort: 3001
          name: http
        readinessProbe:
          httpGet:
            path: /api/v1/health/ready   # comprueba también que ClickHouse responde
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/health         # solo el proceso: una caída de ClickHouse no debe reiniciar la API
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
{{- toYaml .Values.resources.api | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    name: http
  selector:
    app: api

