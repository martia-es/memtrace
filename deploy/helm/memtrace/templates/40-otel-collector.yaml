apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Release.Namespace }}
data:
  otel-collector-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      # Solo la pasarela de ingesta de la API (ADR-089) conoce este token: aunque otro pod llegue al puerto 4318 (una
      # NetworkPolicy no aplicada, o un CNI que no las aplica), el Collector rechaza lo que no lo presente (ADR-090).
      bearertokenauth:
        token: ${env:INGEST_INTERNAL_TOKEN}

    receivers:
      # Solo OTLP/HTTP y solo detrás de la pasarela: no hay gRPC porque no pasaría por la validación de API key (ADR-090)
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            auth:
              authenticator: bearertokenauth

    processors:
      # Evita que el collector exceda el límite de memoria del contenedor
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      # Capa 2 de PII (ADR-084): enmascara con **** los datos personales de formato fijo ANTES de publicar en
      # el broker (nada sin enmascarar llega a Kafka), para todos los agentes, hayan activado o no la anonimización del SDK. Los nombres propios y el
      # texto libre no tienen formato fijo y solo los cubre el SDK (Presidio). Los patrones son RE2; las pruebas
      # están en scripts/check_collector_pii.py. Un patrón nuevo se añade en los TRES bloques.
      transform/pii:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - 'replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b(?:\\d{4}[ -]){3}\\d{4}\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b(?:4\\d{12}(?:\\d{3})?|5[1-5]\\d{14}|3[47]\\d{13}|6011\\d{12})\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b[A-Z]{2}\\d{2}(?: ?[A-Z0-9]{4}){3,7}(?: ?[A-Z0-9]{1,4})?\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b\\d{8}-?[A-HJ-NP-TV-Za-hj-np-tv-z]\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b[XYZxyz]-?\\d{7}-?[A-Za-z]\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b\\d{3}-\\d{2}-\\d{4}\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\+\\d{1,3}[ .-]?\\(?\\d{1,4}\\)?(?:[ .-]?\\d{2,4}){2,4}\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b[6-9]\\d{2}(?:[ .-]\\d{3}[ .-]\\d{3}|[ .-]\\d{2}[ .-]\\d{2}[ .-]\\d{2})\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b", "****")'
          - context: span
            statements:
              - 'replace_pattern(status.message, "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}", "****")'
              - 'replace_pattern(status.message, "\\b(?:\\d{4}[ -]){3}\\d{4}\\b", "****")'
              - 'replace_pattern(status.message, "\\b(?:4\\d{12}(?:\\d{3})?|5[1-5]\\d{14}|3[47]\\d{13}|6011\\d{12})\\b", "****")'
              - 'replace_pattern(status.message, "\\b[A-Z]{2}\\d{2}(?: ?[A-Z0-9]{4}){3,7}(?: ?[A-Z0-9]{1,4})?\\b", "****")'
              - 'replace_pattern(status.message, "\\b\\d{8}-?[A-HJ-NP-TV-Za-hj-np-tv-z]\\b", "****")'
              - 'replace_pattern(status.message, "\\b[XYZxyz]-?\\d{7}-?[A-Za-z]\\b", "****")'
              - 'replace_pattern(status.message, "\\b\\d{3}-\\d{2}-\\d{4}\\b", "****")'
              - 'replace_pattern(status.message, "\\+\\d{1,3}[ .-]?\\(?\\d{1,4}\\)?(?:[ .-]?\\d{2,4}){2,4}\\b", "****")'
              - 'replace_pattern(status.message, "\\b[6-9]\\d{2}(?:[ .-]\\d{3}[ .-]\\d{3}|[ .-]\\d{2}[ .-]\\d{2}[ .-]\\d{2})\\b", "****")'
              - 'replace_pattern(status.message, "\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b", "****")'
          - context: spanevent
            statements:
              - 'replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b(?:\\d{4}[ -]){3}\\d{4}\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b(?:4\\d{12}(?:\\d{3})?|5[1-5]\\d{14}|3[47]\\d{13}|6011\\d{12})\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b[A-Z]{2}\\d{2}(?: ?[A-Z0-9]{4}){3,7}(?: ?[A-Z0-9]{1,4})?\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b\\d{8}-?[A-HJ-NP-TV-Za-hj-np-tv-z]\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b[XYZxyz]-?\\d{7}-?[A-Za-z]\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b\\d{3}-\\d{2}-\\d{4}\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\+\\d{1,3}[ .-]?\\(?\\d{1,4}\\)?(?:[ .-]?\\d{2,4}){2,4}\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b[6-9]\\d{2}(?:[ .-]\\d{3}[ .-]\\d{3}|[ .-]\\d{2}[ .-]\\d{2}[ .-]\\d{2})\\b", "****")'
              - 'replace_all_patterns(attributes, "value", "\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b", "****")'

    exporters:
      # Publica en Kafka (ADR-098). SIN cola ni reintentos propios: si el broker no confirma (acks=all, replicado), el error
      # vuelve a `ingest` como 5xx y el agente reintenta. Así "recibido" solo se dice cuando el dato está a salvo en el broker.
      # Sin `partition_traces_by_id`: con él el exportador parte cada petición en UN mensaje POR TRAZA (cientos por lote) y el
      # escritor insertaría una a una; el orden no hace falta (se lee por TraceId). Cada petición de ingest es un solo mensaje.
      # No se fija `protocol_version`: con 2.6.x Redpanda rechaza la petición y con el valor por defecto funcionan todos.
      kafka:
        brokers: [{{ range $i, $b := splitList "," (default "kafka:9092" .Values.broker.external.bootstrapServers) }}{{ if $i }}, {{ end }}{{ trim $b | quote }}{{ end }}]
        topic: otel-traces
        encoding: otlp_proto
        producer:
          required_acks: -1             # all: la confirmación espera a las réplicas en sincronía (min.insync.replicas)
          compression: zstd
          max_message_bytes: 10485760   # 10 MiB, como el tope del gateway
        sending_queue:
          enabled: false
        retry_on_failure:
          enabled: false

    service:
      extensions: [health_check, bearertokenauth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/pii]
          exporters: [kafka]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1                 # sin estado: se puede escalar (ADR-098)
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: {{ include "memtrace.image" .Values.images.otelCollector }}
        args: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
        env:
        - name: INGEST_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: ingest-internal
              key: token
        ports:
        - containerPort: 4318
          name: otlp-http
        - containerPort: 13133
          name: health
        readinessProbe:
          httpGet:
            path: /
            port: health
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
{{- toYaml .Values.resources.collector | nindent 10 }}
        volumeMounts:
        - name: config-volume
          mountPath: /etc/otelcol-contrib
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001        # usuario del contenedor contrib
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: config-volume
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - port: 4318
    targetPort: 4318
    name: otlp-http
  selector:
    app: otel-collector
