# Valores por defecto del chart de MemTrace (ADR-096). Reproducen lo que despliega `kustomization.yaml` en kind, salvo los
# secretos: aquí se generan al azar en la primera instalación y se conservan en las siguientes.
# Guía de uso: docs-site/platform/operations.md

# URL pública desde la que se abre el dashboard (la usa el login federado: AUTH_URL). Con ingress: https://<host>
publicUrl: http://localhost:8080

imagePullPolicy: IfNotPresent   # las imágenes `memtrace/*` solo existen en el registro que tú indiques (ver `images`)

# Imágenes. `memtrace/*` y `localhost/memtrace/*` son las que construye `make images`: en producción cámbialas por las de tu
# registro (repository: registry.example.com/memtrace/api, tag: 1.2.3).
images:
  api:
    repository: memtrace/api
    tag: dev
  awsCli:
    repository: amazon/aws-cli
    tag: 2.17.40
  busybox:
    repository: busybox
    tag: '1.36'
  clickhouse:
    repository: clickhouse/clickhouse-server
    tag: 23.8-alpine
  clickhouseBackup:
    repository: altinity/clickhouse-backup
    tag: 2.5.20
  clickhouseMigrate:
    repository: clickhouse/clickhouse-server
    tag: 24.3-alpine
  curl:
    repository: curlimages/curl
    tag: 8.9.1
  dashboard:
    repository: memtrace/dashboard
    tag: dev
  docs:
    repository: memtrace/docs
    tag: dev
  grafana:
    repository: grafana/grafana
    tag: 11.2.0
  ingest:
    repository: memtrace/ingest
    tag: dev
  kafka:
    repository: apache/kafka
    tag: 3.8.0
  kafkaExporter:
    repository: danielqsj/kafka-exporter
    tag: v1.8.0
  modelPricing:
    repository: localhost/memtrace/model-pricing
    tag: dev
  modelQuality:
    repository: localhost/memtrace/model-quality
    tag: dev
  otelCollector:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.96.0
  postgres:
    repository: postgres
    tag: 16-alpine
  prometheus:
    repository: prom/prometheus
    tag: v2.53.2
  topicExtraction:
    repository: localhost/memtrace/topic-extraction
    tag: dev

# Disco de cada almacén. `className` vacío usa la StorageClass por defecto del clúster.
storage:
  className: ""
  clickhouse: { size: 10Gi }
  postgres: { size: 5Gi }
  prometheus: { size: 5Gi }     # solo con monitoring.enabled
  grafana: { size: 1Gi }        # idem
  kafka: { size: 10Gi }          # por nodo del broker
  backups: { size: 5Gi }
  topicModel: { size: 1Gi }

resources:
  api:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  collector:
    limits:
      cpu: '1'
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  dashboard:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi
  grafana:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  ingest:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  kafka:
    limits:
      cpu: '1'
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 768Mi
  kafkaExporter:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi
  prometheus:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Broker de mensajes entre el Collector de entrada y el de escritura (ADR-098): Apache Kafka en modo KRaft. Por defecto, 1 nodo y
# replicación 1 (desarrollo). En producción, 3 nodos: `replicas: 3`, `replicationFactor: 3`, `minInsyncReplicas: 2`. Los Collectors
# sin estado se pueden escalar (`kubectl scale`), los de escritura hasta `partitions`.
# Con un Kafka gestionado (MSK, Confluent Cloud, Event Hubs con endpoint Kafka...) o Redpanda, pon su dirección en
# `external.bootstrapServers` (separadas por comas): no se despliega el StatefulSet y los Collectors apuntan a ella. Ajusta también
# `networkPolicy` (las reglas apuntan a los pods del chart) y, si hace falta, autenticación en los Collectors.
broker:
  replicas: 1
  replicationFactor: 1
  minInsyncReplicas: 1
  partitions: 12                      # tantos Collectors de escritura en paralelo como máximo; se pueden añadir, no quitar
  retentionHours: 48                  # el broker es un amortiguador, no un archivo
  retentionBytesPerPartition: 536870912   # 512 MiB por partición: un consumidor parado no llena el disco sin que se note
  heap: "-Xms512m -Xmx512m"
  createTopic: true                   # Job que crea el tópico `otel-traces` y reaplica sus ajustes en cada release
  external:
    bootstrapServers: ""

# Bases de datos. Por defecto corren dentro del clúster (un solo pod cada una). Con `external.host` no se despliega el pod:
# el Service `clickhouse` / `postgres` pasa a ser un ExternalName hacia ese host y las copias de ClickHouse se desactivan.
# Con una base externa, ajusta también `networkPolicy` (las reglas apuntan a los pods del chart) o desactívala.
clickhouse:
  external:
    host: ""
postgres:
  external:
    host: ""

# Secretos. Con `create: true` el chart crea los Secret con estos valores; cada valor vacío se genera al azar la primera vez
# y se conserva al actualizar. Con `create: false` los creas tú (External Secrets, Sealed Secrets...) con los mismos nombres y
# claves; la lista completa está en docs-site/platform/operations.md.
secrets:
  create: true
  clickhouse:
    password: ""
    writerPassword: ""
    retentionPassword: ""
    readerPassword: ""
    collectorPassword: ""
  postgres:
    password: ""
  ingestToken: ""
  grafana:                    # solo con monitoring.enabled; vacía = al azar
    password: ""
  oauth:                      # login federado (ADR-013); AUTH_SECRET se genera si lo dejas vacío
    authSecret: ""
    googleClientId: ""
    googleClientSecret: ""
    microsoftApplicationId: ""
    microsoftTenantId: ""
    microsoftClientSecret: ""
  resend:                     # emails de invitación y alertas (ADR-014)
    apiKey: ""
    emailFrom: ""
  githubApp:                  # despliegues desde MemTrace (ADR-064); solo se crea si das `appId`
    appId: ""
    privateKey: ""
    webhookSecret: ""

# Copias de seguridad (ADR-096). Siempre al volumen `backups`; con `s3.bucket` también a un bucket S3 o compatible.
backup:
  enabled: true
  s3:
    bucket: ""
    prefix: memtrace
    region: ""
    endpoint: ""              # solo para almacenamiento no AWS (MinIO, R2...)
    accessKeyId: ""
    secretAccessKey: ""

# Monitoring opcional (ADR-098): Prometheus (métricas del pipeline y reglas de alerta) y Grafana (paneles). Grafana NO sale por el
# ingress: ábrelo con `kubectl -n <ns> port-forward svc/grafana 3000:3000`. En local suele ir apagado; en la nube, encendido.
# Las alertas se evalúan y se ven en Prometheus y Grafana; enviarlas a un canal (Alertmanager) lo configuras tú.
monitoring:
  enabled: false

# Acceso desde fuera. El dashboard hace de proxy de /api, así que un solo host basta (también para la ingesta de trazas).
ingress:
  enabled: false
  className: ""
  host: ""
  docsHost: ""                # opcional: publica también la documentación
  annotations: {}
  tls:
    secretName: ""

# NetworkPolicy (default-deny + reglas por pieza). Necesita un CNI que las aplique (Calico, Cilium...).
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx          # namespace del controlador de ingress, que puede llegar al dashboard
  internalCidrs: [10.244.0.0/16, 10.96.0.0/12]   # CIDR de pods y servicios del clúster: la API y los jobs no salen hacia ellos
